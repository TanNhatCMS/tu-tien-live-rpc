name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: node --check server.js
      - run: node --check public/js/live.js
      - run: node --check public/js/audio.js
      - run: node --check public/js/particles.js
      - run: npm test
